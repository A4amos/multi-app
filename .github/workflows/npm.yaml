name: Publish Node Package

on:
    push: 
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read
    packages: write

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./node-package

        steps: 
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with: 
                node-version: 20
                registry-url: 'https://npm.pkg.github.com'
                scope: "@smartcloud2023"

            - name: Install dependencies
              run: npm install 

            - name: Build package
              run: npm run build  

            - name: Publish package now
              run: npm publish
              env:
                NODE_AUTH_TOKEN: ${{secrets.NODE_AUTH_TOKEN}}


            - name: Read package version
              id: package
              run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
            
            - name: Create GitHub Release
              env:
                    GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
                    VERSION: ${{ inputs.version }}
              run: |
                    TAG="v${VERSION}"
                    REPO="${GITHUB_REPOSITORY}"
                    USERNAME="${GITHUB_ACTOR}"

                    echo "Creating release for ${TAG}"

                    # Find previous release tag
                    PREVIOUS_TAG=$(git tag --sort=-version:refname | grep '^v' | head -1 || true)

                    if [ -n "$PREVIOUS_TAG" ] && [ "$PREVIOUS_TAG" != "$TAG" ]; then
                    CHANGELOG_URL="https://github.com/${REPO}/compare/${PREVIOUS_TAG}...${TAG}"
                    CHANGELOG_TEXT="${PREVIOUS_TAG}...${TAG}"
                    else
                    CHANGELOG_URL="https://github.com/${REPO}/commits/${TAG}"
                    CHANGELOG_TEXT="View commit history"
                    fi

                    RELEASE_BODY=$(cat <<EOF
                    [**${TAG}**](https://github.com/${REPO}/releases/tag/${TAG}) [**Latest**](https://github.com/${REPO}/releases/latest)

                    [**Repository**](https://github.com/${REPO})

                    **${USERNAME}** released this.

                    [ ${TAG}](https://github.com/${REPO}/tree/${TAG})

                    ## What's Changed

                    - Initial release of **smartmath-node ${VERSION}**
                    - Added Node.js mathematics functions
                    - Published package to GitHub Packages

                    ## Installation

                    \`\`\`bash
                    npm install @smartcloud2023/smartmath-node
                    \`\`\`

                    ## Package

                    [View package on GitHub Packages](https://github.com/${REPO}/packages)

                    ## Full Changelog

                    [${CHANGELOG_TEXT}](${CHANGELOG_URL})

                    ### Contributors

                    - [**${USERNAME}**](https://github.com/${USERNAME})
                    EOF
                    )

                        echo "$RELEASE_BODY"

                        jq -n \
                        --arg tag "$TAG" \
                        --arg body "$RELEASE_BODY" \
                        '{
                            tag_name: $tag,
                            target_commitish: "main",
                            name: ("smartmath-node " + $tag),
                            body: $body,
                            draft: false,
                            prerelease: false,
                            generate_release_notes: false
                        }' |
                        curl --fail-with-body -L \
                        -X POST \
                        -H "Accept: application/vnd.github+json" \
                        -H "Authorization: Bearer $GH_TOKEN" \
                        -H "X-GitHub-Api-Version: 2026-03-10" \
                        "https://api.github.com/repos/${REPO}/releases" \
                        -d @-
            # - name: Create GitHub Release
            #   uses: softprops/action-gh-release@v2
            #   with:
            #     tag_name: "v${{ inputs.version }}"
            #     name: "smartmath-node v${{ inputs.version }}"
            #     body: |
            #         ## smartmath-node v${{ inputs.version }}

            #         Node.js package published to GitHub Packages.

            #         ### Installation

            #         ```bash
            #         npm install @smartcloud2023/smartmath-node
            #         ```
            #     files: |
            #         node-package/*.tgz
            #   env:
            #     GITHUB_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}