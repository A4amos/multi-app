name: Publish Node Package

on:
    push: 
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read
    packages: write
    id-token: write

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./node-package

        steps: 
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with: 
                node-version: 20
                registry-url: 'https://npm.pkg.github.com'
                scope: "@smartcloud2023"
                cache: npm

            - name: Install dependencies
              run: npm install

            - name: Build package
              run: npm run build

            - name: Publish package now
              run: npm publish
              env:
                NODE_AUTH_TOKEN: ${{secrets.NODE_AUTH_TOKEN}}