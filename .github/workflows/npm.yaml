name: Publish Node Package

on:
    push: 
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read
    packages: write

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./node-package

        steps: 
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with: 
                node-version: 20
                registry-url: 'https://npm.pkg.github.com'
                scope: "@smartcloud2023"

            - name: Install dependencies
              run: npm install 

            - name: Build package
              run: npm run build  

            - name: Publish package now
              run: npm publish
              env:
                NODE_AUTH_TOKEN: ${{secrets.NODE_AUTH_TOKEN}}


            - name: Read package version
              id: package
              run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
            
            - name: Create GitHub Release
              env:
                 GH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
                 inputs.version: ${{ steps.package.outputs.version }}
              run: |
                    curl -L \
                    -X POST \
                    -H "Accept: application/vnd.github+json" \
                    -H "Authorization: Bearer $GH_TOKEN" \
                    -H "X-GitHub-Api-Version: 2026-03-10" \
                    https://api.github.com/repos/${{ github.repository }}/releases \
                    -d '{
                        "tag_name": "v${{ inputs.version }}",
                        "target_commitish": "main",
                        "name": "smartmath-node v${{ inputs.version }}",
                        "body": "smartmath-node v${{ inputs.version }}",
                        "draft": false,
                        "prerelease": false,
                        "generate_release_notes": true
                    }'
            # - name: Create GitHub Release
            #   uses: softprops/action-gh-release@v2
            #   with:
            #     tag_name: "v${{ inputs.version }}"
            #     name: "smartmath-node v${{ inputs.version }}"
            #     body: |
            #         ## smartmath-node v${{ inputs.version }}

            #         Node.js package published to GitHub Packages.

            #         ### Installation

            #         ```bash
            #         npm install @smartcloud2023/smartmath-node
            #         ```
            #     files: |
            #         node-package/*.tgz
            #   env:
            #     GITHUB_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}



# ============================================================
  # JOB 2: Create GitHub Release
  # ============================================================
    release:
        name: Create GitHub Release
        runs-on: ubuntu-latest

        needs: build

        steps:

            - name: Checkout repository
              uses: actions/checkout@v5
              with:
                fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                node-version: "24"

            - name: Install dependencies
              working-directory: node-package
              run: npm install

            - name: Build package
              working-directory: node-package
              run: npm run build

            # --------------------------------------------------------
            # Read version from package.json
            # --------------------------------------------------------
            - name: Read package version
              id: package
              working-directory: node-package
              run: |
                VERSION=$(node -p "require('./package.json').version")

                echo "VERSION=$VERSION"

                echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Prepare release information
      # --------------------------------------------------------
            - name: Prepare release information
              id: release
              env:
                VERSION: ${{ steps.package.outputs.version }}
              run: |
                TAG="v${VERSION}"

                echo "TAG=${TAG}"

                echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

                PREVIOUS_TAG=$(git tag --sort=-version:refname | grep '^v[0-9]' | grep -v "^${TAG}$" | head -1 || true)

                if [ -n "$PREVIOUS_TAG" ]; then
                    CHANGELOG_URL="https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${TAG}"
                    CHANGELOG_TEXT="${PREVIOUS_TAG}...${TAG}"
                else
                    CHANGELOG_URL="https://github.com/${GITHUB_REPOSITORY}/commits/${TAG}"
                    CHANGELOG_TEXT="View commit history"
                fi

                echo "PREVIOUS_TAG=${PREVIOUS_TAG}"
                echo "CHANGELOG_URL=${CHANGELOG_URL}"

                echo "previous_tag=${PREVIOUS_TAG}" >> "$GITHUB_OUTPUT"
                echo "changelog_url=${CHANGELOG_URL}" >> "$GITHUB_OUTPUT"
                echo "changelog_text=${CHANGELOG_TEXT}" >> "$GITHUB_OUTPUT"

            # --------------------------------------------------------
            # Create GitHub Release
            # --------------------------------------------------------
            - name: Create GitHub Release
              env:
                GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
                VERSION: ${{ steps.package.outputs.version }}
                TAG: ${{ steps.release.outputs.tag }}
                CHANGELOG_URL: ${{ steps.release.outputs.changelog_url }}
                CHANGELOG_TEXT: ${{ steps.release.outputs.changelog_text }}
              run: |

                RELEASE_BODY=$(cat <<EOF
                [**${TAG}**](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}) [**Latest**](https://github.com/${GITHUB_REPOSITORY}/releases/latest)

                        [**Repository**](https://github.com/${GITHUB_REPOSITORY})

                        **${GITHUB_ACTOR}** released this.

                        [ ${TAG}](https://github.com/${GITHUB_REPOSITORY}/tree/${TAG})

                        ## What's Changed

                        - Added Node.js mathematics functions
                        - Published package to GitHub Packages
                        - Added automated package build
                        - Added automated GitHub Release

                        ## Installation

                        \`\`\`bash
                        npm install @smartcloud2023/smartmath-node
                        \`\`\`

                        ## Package

                        [View package on GitHub Packages](https://github.com/${GITHUB_REPOSITORY}/packages)

                        ## Full Changelog

                        [${CHANGELOG_TEXT}](${CHANGELOG_URL})

                        ### Contributors

                        - [**${GITHUB_ACTOR}**](https://github.com/${GITHUB_ACTOR})
                        EOF
                        )

                                echo "$RELEASE_BODY"

                                jq -n \
                                    --arg tag "$TAG" \
                                    --arg body "$RELEASE_BODY" \
                                    '{
                                    tag_name: $tag,
                                    target_commitish: "main",
                                    name: ("smartmath-node " + $tag),
                                    body: $body,
                                    draft: false,
                                    prerelease: false,
                                    generate_release_notes: false
                                    }' |
                                curl --fail-with-body -L \
                                    -X POST \
                                    -H "Accept: application/vnd.github+json" \
                                    -H "Authorization: Bearer ${GH_TOKEN}" \
                                    -H "X-GitHub-Api-Version: 2026-03-10" \
                                    "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
                                    -d @-

                            # --------------------------------------------------------
                            # Upload .tgz package to GitHub Release
                            # --------------------------------------------------------
                            - name: Upload npm package to release
                                env:
                                GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
                                VERSION: ${{ steps.package.outputs.version }}
                                run: |
                                TAG="v${VERSION}"
                                PACKAGE="node-package/smartmath-node-${VERSION}.tgz"

                                echo "Uploading ${PACKAGE} to ${TAG}"

                                gh release upload \
                                    "${TAG}" \
                                    "${PACKAGE}" \
                                    --repo "${GITHUB_REPOSITORY}" \
                                    --clobber